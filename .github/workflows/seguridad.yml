name: Seguridad

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secretos:
    name: Secretos
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Obtener repositorio e historial
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Instalar Gitleaks con checksum verificado
        shell: bash
        run: |
          set -euo pipefail
          version=8.30.1
          archive="gitleaks_${version}_linux_x64.tar.gz"
          checksums="gitleaks_${version}_checksums.txt"
          base_url="https://github.com/gitleaks/gitleaks/releases/download/v${version}"
          download_dir="$(mktemp -d)"
          trap 'rm -rf "$download_dir"' EXIT
          cd "$download_dir"
          curl --fail --silent --show-error --location --retry 3 \
            "${base_url}/${archive}" --output "$archive"
          curl --fail --silent --show-error --location --retry 3 \
            "${base_url}/${checksums}" --output "$checksums"
          awk -v file="$archive" '$2 == file { print }' "$checksums" > selected-checksum.txt
          test -s selected-checksum.txt
          sha256sum --check --strict selected-checksum.txt
          tar -xzf "$archive" gitleaks
          install -D -m 0755 gitleaks "$HOME/.local/bin/gitleaks"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Escanear secretos en el historial
        run: gitleaks git --config .gitleaks-ci.toml --redact

  iac:
    name: Infraestructura y Kubernetes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Preparar Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: Instalar Checkov
        run: python -m pip install checkov==3.4.3

      - name: Escanear Terraform y Kubernetes con Checkov
        run: |
          checkov -d . --framework terraform kubernetes \
            --skip-path '(^|/)legacy(/|$)' \
            --skip-path '(^|/)reto(/|$)' \
            --compact --quiet \
            --output cli --output sarif \
            --output-file-path "console,$RUNNER_TEMP/checkov.sarif"

      - name: Escanear configuracion y secretos con Trivy
        if: ${{ !cancelled() }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: misconfig,secret
          severity: HIGH,CRITICAL
          exit-code: '1'
          skip-dirs: legacy,reto
          trivyignores: .trivyignore.yaml
          format: sarif
          limit-severities-for-sarif: 'true'
          output: ${{ runner.temp }}/trivy.sarif

      - name: Subir SARIF de Checkov
        if: ${{ always() }}
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: ${{ runner.temp }}/checkov.sarif
          category: checkov

      - name: Subir SARIF de Trivy
        if: ${{ always() }}
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: ${{ runner.temp }}/trivy.sarif
          category: trivy
