# Permisos del despliegue del visor (heredado). Ejemplo con fallos deliberados.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: visor-deployer
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: visor-deployer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: default
    namespace: visor
